name: Deploy site to Pages

# הערה: הרצת npm run scrape דרך GitHub Actions נכשלת - cms.co.il מריץ Cloudflare
# שחוסם בקשות שמגיעות מכתובות IP של שירותי ענן/CI (HTTP 403), ללא קשר ל-User-Agent
# או לקצב הבקשות. הסקרייפינג בפועל צריך לרוץ ממחשב "רגיל" (לא ענן) - ראו README.
# ה-workflow הזה רק מפרסם מחדש את site/ בכל פעם שנדחף שינוי ל-main (כולל שינוי
# שנדחף מריצת סקרייפ מקומית).

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
